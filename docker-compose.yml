services:
  gemini:
    image: gemini-video-analysis:${IMAGE_ARCH:-amd64}
    platform: ${IMAGE_PLATFORM:-linux/amd64}
    ports:
      - "${HOST_PORT:-8008}:8000"
    volumes:
      - ./data:/app/data
      - ./result:/app/result
      - gemini_mysql:/var/lib/mysql
    environment:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
      MYSQL_DATABASE: geniview
    restart: unless-stopped
volumes:
  gemini_mysql:
