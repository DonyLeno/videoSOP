<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geniview Video Analysis</title>
    <!-- Use Local Chart.js -->
    <script src="/assets/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body class="login-active">
    <div id="loginPage" class="login-page">
      <div class="login-card">
        <div class="login-hero">
          <div class="login-brand">Geniview AI</div>
          <div class="login-subtitle" data-i18n="login_subtitle">视频动作分析与标注平台</div>
          <div class="login-meta" data-i18n="login_meta">登录后进入项目工作区，统一完成视频上传、检测任务与结果查看。</div>
        </div>
        <div class="login-form">
          <div class="login-title" data-i18n="login_welcome">欢迎回来</div>
          <div class="modal-form-group">
            <label data-i18n="login_username">用户名</label>
            <input type="text" id="loginUsername" class="modal-input">
          </div>
          <div class="modal-form-group">
            <label data-i18n="login_password">密码</label>
            <input type="password" id="loginPassword" class="modal-input">
          </div>
          <div class="login-error" id="loginError"></div>
          <button class="login-button" id="btnConfirmLogin" data-i18n="login_button">登录</button>
        </div>
      </div>
    </div>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <div class="app-shell" id="appShell">
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title">Geniview AI</div>
          <button id="sidebarToggle" class="sidebar-toggle" type="button">⟨</button>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-section-label" data-i18n="nav_workspace">工作区</div>
          <div class="nav-item nav-tree-root active" data-short="项" data-i18n-short="nav_short_projects" data-tab="projects" id="sidebarProjectsRoot">
            <button class="sidebar-tree-toggle" type="button" id="sidebarProjectToggle" aria-expanded="true">
              <span class="sidebar-tree-chevron">▾</span>
            </button>
            <span class="nav-tree-label" onclick="switchTab('projects')" data-i18n="nav_projects">项目中心</span>
            <span class="sidebar-tree-count" id="sidebarProjectCount"></span>
          </div>
          <div id="sidebarProjectList" class="sidebar-project-list sidebar-tree-children"></div>
        </div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-section">
          <div class="nav-item" data-short="管" data-i18n-short="nav_short_users" data-tab="users" id="navUsers" onclick="switchTab('users')" style="display:none;" data-i18n="nav_users">用户管理</div>
          <div class="nav-item" data-short="设" data-i18n-short="nav_short_settings" data-tab="settings" onclick="switchTab('settings')" data-i18n="nav_settings">设置</div>
        </div>

        <div class="sidebar-user">
          <div class="sidebar-user-name" id="sidebarUser" data-i18n="not_logged_in">未登录</div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-small" id="btnShowLogin" data-i18n="login_button">登录</button>
            <button class="btn btn-small" id="btnLogout" style="display:none;" data-i18n="logout">退出</button>
          </div>
        </div>
      </div>

      <div class="content">
        <!-- 项目中心：所有项目的入口 -->
        <div id="view-projects" class="page-view active">
          <div data-include="/pages/projects.html"></div>
        </div>

        <!-- 项目工作区：视频、检测、结果、设置都在项目内完成 -->
        <div id="view-project" class="page-view">
          <div data-include="/pages/project.html"></div>
        </div>

        <div id="view-users" class="page-view">
          <div data-include="/pages/users.html"></div>
        </div>

        <div id="view-settings" class="page-view">
          <div data-include="/pages/settings.html"></div>
        </div>

      </div>

      <div id="notifyModal" class="modal-overlay">
        <div class="modal-content" style="width: 420px;">
          <div class="modal-header" id="notifyTitle" data-i18n="notify_title">Geniview 通知</div>
          <div class="modal-message" id="notifyMessage"></div>
          <div class="modal-actions">
            <button class="btn-modal btn-ok" id="btnNotifyOk" data-i18n="ok">确定</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/assets/js/main.js?v=20261108"></script>
  </body>
</html>
