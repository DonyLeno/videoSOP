<div class="panel detection-panel">
  <div class="panel-header">
    <div class="user-toolbar">
      <span data-i18n="project_detection_title">检测任务</span>
      <button class="btn btn-small" type="button" onclick="switchProjectTab('videos')" data-i18n="project_go_video_library">前往视频库</button>
    </div>
  </div>
  <div class="panel-body">
    <div class="form-group">
      <label class="form-label" data-i18n="detection_fps_label">FPS (0.5–3 每秒采样帧数)</label>
      <input type="number" id="detectFps" class="form-control" value="2.0" step="0.1" min="0.5" max="3">
    </div>

    <div class="form-group">
      <label class="form-label" data-i18n="detection_select_video">选择视频</label>
      <select id="detectVideoSelect" class="form-control">
        <option value="" data-i18n="loading">加载中...</option>
      </select>
      <div class="form-hint" data-i18n="project_detection_hint">检测会使用当前项目与产线的 SOP，结果生成后可在「结果查看」中打开。</div>
    </div>

    <div class="form-group">
      <label class="form-label" data-i18n="detect_model_label">模型</label>
      <select id="detectModel" class="form-control">
        <option value="kimi-2.5" data-price-in="0.0" data-price-out="0.0" selected data-i18n="detect_model_default">GeniviewK2.5 (长文本/视觉增强)</option>
        <option value="qwen3.8-max">Geni3.8 Max</option>
        <option value="qwen3.7-plus">Geni3.7 Plus</option>
        <option value="qwen3.8-flash">Geni3.8 Flash</option>
        <option value="gemini2.5flash">Genie 2.5 Flash</option>
        <option value="gemini3flash">Genie 3 Flash</option>
      </select>
    </div>

    <button id="btnEstimateCost" class="btn" style="display:none;" data-i18n="estimate_cost">预估费用</button>
    <div id="costEstimate" style="display:none;"></div>

    <button id="btnStartDetect" class="btn detection-start" type="button" data-i18n="start_detect">开始检测与标注</button>
  </div>
</div>

<div id="taskRunningBar" class="task-running-bar" style="flex-direction: column; align-items: stretch; gap: 8px;">
  <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
    <div class="loading-spinner-small"></div>
    <div data-i18n="detect_running_hint">正在对视频进行检测分析，请稍等...</div>
  </div>
  <div style="height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; width: 100%;">
    <div id="detectionProgressBar" style="height: 100%; width: 0%; background: var(--accent); transition: width 0.2s;"></div>
  </div>
  <div id="detectionProgressText" style="text-align: center; font-size: 11px; color: var(--muted);" data-i18n="prepare_text">准备中...</div>
</div>

<div class="detection-log-toolbar">
  <button id="btnToggleDetectLog" class="btn btn-small" type="button" data-i18n="collapse_log">折叠日志</button>
</div>

<div id="thumbnailContainer" style="display: none; margin: 10px 0; text-align: center;">
  <img id="detectThumbnail" src="" alt="实时检测预览" data-i18n-alt="detect_preview_alt" style="max-width: 320px; max-height: 240px; border: 1px solid var(--border); border-radius: 8px;">
</div>
<div id="detectLog" class="log-panel" style="display: none;"></div>

<div id="loadingModal" class="modal-overlay">
  <div class="modal-content" style="width: 300px; text-align: center; padding: 30px;">
    <div class="loading-spinner"></div>
    <div style="font-size: 16px; color: var(--text);" data-i18n="detect_running_hint">正在对视频进行检测分析，请稍等...</div>
  </div>
</div>
