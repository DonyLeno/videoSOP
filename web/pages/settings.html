<div class="topbar">
  <div class="topbar-left">
    <button class="menu-button" type="button" data-menu-button>☰</button>
    <div class="page-title" data-i18n="settings_title">系统设置</div>
  </div>
</div>
<div class="panel" style="max-width: 600px; margin: 0 auto; width: 100%;">
  <div class="panel-header" data-i18n="settings_general">通用设置</div>
  <div class="panel-body">
    <div class="form-group">
        <label class="form-label" data-i18n="settings_theme">主题模式</label>
        <div style="display: flex; gap: 10px; align-items: center;">
            <select id="settingsTheme" class="form-control" style="max-width: 220px;">
                <option value="dark" data-i18n="theme_dark">深色模式</option>
                <option value="light" data-i18n="theme_light">浅色模式</option>
            </select>
        </div>
        <div style="margin-top: 8px; font-size: 12px; color: var(--muted);" data-i18n="settings_theme_tip">
          切换后立即生效，并记住你的选择。
        </div>
    </div>
    <div class="form-group">
        <label class="form-label" data-i18n="settings_language">语言</label>
        <div style="display: flex; gap: 10px; align-items: center;">
            <select id="settingsLang" class="form-control" style="max-width: 220px;">
                <option value="zh" data-i18n="lang_zh">中文</option>
                <option value="en" data-i18n="lang_en">English</option>
            </select>
        </div>
        <div style="margin-top: 8px; font-size: 12px; color: var(--muted);" data-i18n="settings_language_tip">
          切换后立即生效，并记住你的选择。
        </div>
    </div>
    <p style="color: var(--muted); font-size: 13px;">
      <span data-i18n="settings_version_label">当前版本:</span>
      <span id="currentVersion" data-i18n="settings_version_loading">loading...</span>
    </p>
  </div>
</div>
