# 阶段 4.2 批次 G：CI——单元测试（sqlite 模式）+ Docker 镜像构建 + trivy 安全扫描 + compose 配置校验
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 测试为 sqlite 模式（tests/__init__.py 锁定），无需 MySQL 服务
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose config
        run: docker compose -f docker/docker-compose.yml config

      - name: Build application image
        run: docker build -f docker/Dockerfile -t geniview:ci .

      # 报告模式（exit-code 0）：CRITICAL/HIGH 漏洞输出到日志与摘要，不阻断流水线；
      # 待基线稳定后可将 exit-code 收紧为 1。
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: geniview:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
