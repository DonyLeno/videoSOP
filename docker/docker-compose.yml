services:
  gemini:
    image: gemini-project:${APP_IMAGE_TAG:-latest}
    container_name: gemini-server
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - ../data:/app/data
      - ../result:/app/result
      - ../mysql:/var/lib/mysql
    environment:
      - MYSQL_HOST=127.0.0.1
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - MYSQL_DATABASE=geniview
    restart: unless-stopped
